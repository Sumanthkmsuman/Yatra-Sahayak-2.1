name: Deploy Yatra Sahayak

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Prepare GitHub Pages site
        run: |
          rm -rf site
          mkdir -p site
          cp -R .output/public/. site/

          echo "=== SITE ROOT ==="
          ls -la site

          echo "=== INDEX CHECK ==="
          test -f site/index.html
          echo "index.html exists"

      - name: Fix GitHub Pages asset paths
        run: |
          sed -i 's#="/assets/#="./assets/#g' site/index.html
          sed -i "s#'/assets/#'./assets/#g" site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
# GitHub Pages deployment
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
