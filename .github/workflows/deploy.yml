name: Deploy Yatra Sahayak

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Check build output
        run: |
          echo "===================="
          echo "ALL INDEX FILES"
          echo "===================="
          find . -type f -name "index.html" \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            -print

          echo "===================="
          echo "DIST FILES"
          echo "===================="
          find dist -maxdepth 5 -type f 2>/dev/null || true

          echo "===================="
          echo "OUTPUT FILES"
          echo "===================="
          find .output -maxdepth 5 -type f 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
